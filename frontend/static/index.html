<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CHANKO.LINK</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
  <h1 class="text-center mb-4">🔗 CHANKO.LINK</h1>

  <form id="shortenForm" class="mb-4">
    <div class="mb-3">
      <input type="url" id="original_url" class="form-control" placeholder="https://example.com" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Shorten!</button>
  </form>

  <div id="result" class="alert alert-success d-none"></div>
  <div id="error" class="alert alert-danger d-none"></div>
</div>

<script>
  document.getElementById('shortenForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const original_url = document.getElementById('original_url').value;
    const result = document.getElementById('result');
    const error = document.getElementById('error');

    result.classList.add('d-none');
    error.classList.add('d-none');

    try {
      const res = await fetch('/api/urls/shorten', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ original_url })
      });

      const data = await res.json();

      if (!res.ok) throw new Error(data.detail || 'Unknown error');

      const shortUrl = `${window.location.origin}/api/urls/${data.short_code}`;
      let text = `<strong>Short URL:</strong> <a href="${shortUrl}" target="_blank">${shortUrl}</a>`;

      if (data.click_count !== undefined) {
        text += `<br><strong>Clicks:</strong> ${data.click_count}`;
      }

      result.innerHTML = text;
      result.classList.remove('d-none');
      document.getElementById('original_url').value = '';

    } catch (err) {
      error.textContent = err.message;
      error.classList.remove('d-none');
    }
  });
</script>
</body>
</html>
